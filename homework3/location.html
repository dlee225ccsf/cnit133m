<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Play Games | Location</title>
    <meta name="description" content="Find your current location using geolocation and view it on a map." />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header sticky-top">
      <nav class="navbar navbar-expand-lg navbar-dark container py-3">
        <a class="navbar-brand fw-bold" href="index.html">Pixel Play Games</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
            <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="location.html">Location</a></li>
            <li class="nav-item"><a class="nav-link" href="extra.html">Extra</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="container my-5">
      <div class="page-header mb-4">
        <p class="eyebrow text-uppercase">Where are you?</p>
        <h1>Location</h1>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-lg-5">
          <p id="locationStatus" class="mb-3">Checking your current location...</p>

          <dl class="row mb-4 location-details">
            <div class="col-sm-6 mb-3">
              <dt>Latitude</dt>
              <dd id="latitude">--</dd>
            </div>
            <div class="col-sm-6 mb-3">
              <dt>Longitude</dt>
              <dd id="longitude">--</dd>
            </div>
          </dl>

          <div id="map" aria-label="Map of current location"></div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container text-center py-4">
        <p class="mb-0">© 2026 Pixel Play Games • Play a little, imagine a lot</p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
  </body>
</html>
